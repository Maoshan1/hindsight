[workspace]

[package]
name = "hindsight-app"
version = "0.2.0"
edition = "2021"
description = "20/20 vision for your shell history"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hindsight-core = { path = "../crates/hindsight-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

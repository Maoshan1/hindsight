[package]
name = "hindsight"
version = "0.1.0"
edition = "2021"
description = "20/20 vision for your shell history"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "5"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
ratatui = "0.26"
crossterm = "0.27"

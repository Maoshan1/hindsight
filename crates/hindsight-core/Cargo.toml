[package]
name = "hindsight-core"
version = "0.2.0"
edition = "2021"
description = "Shared storage, search, and settings core for Hindsight"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "5"
hostname = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
